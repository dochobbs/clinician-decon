[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decon"
version = "0.1.0"
description = "PHI decontextualization utilities for clinical web search"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "anthropic>=0.80",
  "openai>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
decon = "decon.cli:main"
decon-app = "decon.app_server:main"
decon-generate-traces = "decon.persona_trace_generator:main"
decon-validate = "decon.validation_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
